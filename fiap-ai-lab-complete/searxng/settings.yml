# ============================================================
# FIAP AI Lab — SearXNG
# Prompt Engineering & AI · 2º Semestre 2026
# ------------------------------------------------------------
# Documentação: https://docs.searxng.org/admin/settings/
#
# `use_default_settings: true` mantém todos os defaults do
# upstream (engines, categorias, plugins) e sobrescreve apenas
# as chaves declaradas abaixo.
#
# IMPORTANTE — `search.formats` precisa conter `json`.
# O Open WebUI consulta o SearXNG com `?format=json`; sem esse
# formato habilitado o SearXNG responde 403 e a busca web falha.
# ============================================================

use_default_settings: true

general:
  instance_name: "FIAP AI Lab Search"
  # Links de doação/contato não fazem sentido numa instância de sala de aula
  donation_url: false
  contact_url: false
  enable_metrics: false

# ------------------------------------------------------------
# Engines
# ------------------------------------------------------------
# `use_default_settings: true` mantém todos os engines do upstream;
# aqui só ligamos/desligamos pelo nome. Se a sua rede não sofrer
# bloqueio, reative um destes trocando `disabled: true` por `false`.
# Gerado por scripts/searxng_engines.py (make searxng-engines).
engines:
  # Confiáveis nesta rede (verificado com ?format=json)
  - name: bing
    disabled: false
  - name: wiby
    disabled: false
  # Bloqueados com CAPTCHA / HTTP 429 — devolvem 0 resultados e ainda
  # gastam o timeout da busca esperando cada um.
  - name: duckduckgo
    disabled: true
  - name: google
    disabled: true
  - name: startpage
    disabled: true
  - name: brave
    disabled: true
  - name: mojeek
    disabled: true
  - name: qwant
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true

server:
  # Sobrescrito por ${SEARXNG_SECRET} definido no docker-compose.
  # NUNCA exponha esta instância na internet com a chave padrão.
  secret_key: "troque-esta-chave-no-env"
  # Limiter (anti-bot) desligado: ele bloqueia o user-agent do
  # Open WebUI ("Open WebUI ... RAG Bot") e do código das aulas.
  # Só ligue se for expor a instância publicamente.
  limiter: false
  public_instance: false
  image_proxy: true
  method: "GET"

search:
  # 0 = None · 1 = Moderate · 2 = Strict
  safe_search: 0
  autocomplete: "bing"
  default_lang: "pt-BR"
  # html  → interface web em http://localhost:8080
  # json  → API consumida pelo Open WebUI, LangChain, Firecrawl,
  #         Gradio/Streamlit e demais scripts das aulas
  formats:
    - html
    - json

valkey:
  # Cache/rate-limit compartilhado. O hostname é o nome do serviço
  # no docker-compose.yml deste projeto.
  url: valkey://searxng-valkey:6379/0

outgoing:
  # Timeout mais folgado: em sala de aula a rede costuma ser lenta
  request_timeout: 6.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 20

ui:
  default_locale: "pt-BR"
  query_in_title: true
  infinite_scroll: false
